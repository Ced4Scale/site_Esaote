<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document — Esaote Medical France</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/logo-esaote.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260728-ce-docs" />
  <script data-goatcounter="https://ced4scale.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body class="document-page">
  <header class="document-viewer__bar">
    <a class="document-viewer__brand" href="index.html#produits" aria-label="Retour au site Esaote">
      <img src="assets/logo-esaote.svg" alt="Esaote" />
    </a>
    <div class="document-viewer__title">
      <span>Document</span>
      <strong id="documentTitle">Esaote Medical France</strong>
    </div>
    <button class="document-viewer__close" id="documentClose" type="button" aria-label="Fermer le document et revenir à la page précédente">&times;</button>
  </header>

  <main class="document-viewer">
    <iframe id="documentFrame" title="Document PDF Esaote" loading="eager" scrolling="yes"></iframe>
    <div class="document-viewer__pages" id="documentPages" hidden></div>
    <div class="document-viewer__fallback" id="documentFallback" hidden>
      <h1>Document indisponible</h1>
      <p>Le document demandé n'est pas disponible depuis ce lecteur.</p>
      <a class="btn" href="index.html#produits">Retour au site</a>
    </div>
  </main>

  <script>
    (function () {
      var docs = {
        "champ-moyen": {
          title: "Particularités Champs Moyens",
          src: "assets/docs/esaote-fr-particularites-champs-moyens-du-irm-strasbourg.pdf"
        },
        "o-scan-brochure": {
          title: "Brochure O-scan",
          src: "assets/docs/o-scan-brochure-latest.pdf",
          pages: [
            "assets/docs/o-scan-brochure-pages/page-01.png",
            "assets/docs/o-scan-brochure-pages/page-02.png",
            "assets/docs/o-scan-brochure-pages/page-03.png",
            "assets/docs/o-scan-brochure-pages/page-04.png",
            "assets/docs/o-scan-brochure-pages/page-05.png",
            "assets/docs/o-scan-brochure-pages/page-06.png",
            "assets/docs/o-scan-brochure-pages/page-07.png",
            "assets/docs/o-scan-brochure-pages/page-08.png",
            "assets/docs/o-scan-brochure-pages/page-09.png",
            "assets/docs/o-scan-brochure-pages/page-10.png",
            "assets/docs/o-scan-brochure-pages/page-11.png",
            "assets/docs/o-scan-brochure-pages/page-12.png"
          ]
        },
        "s-scan-open-brochure": {
          title: "Brochure S-scan Open",
          src: "assets/docs/s-scan-open-brochure-latest.pdf"
        },
        "g-scan-brio-brochure": {
          title: "Brochure G-scan Brio",
          src: "assets/docs/g-scan-brio-brochure-latest.pdf"
        },
        "magnifico-open-brochure": {
          title: "Brochure Magnifico Open",
          src: "assets/docs/magnifico-open-brochure-latest.pdf"
        },
        "i-genius-brochure": {
          title: "Brochure I-Genius",
          src: "assets/docs/i-genius-brochure-latest.pdf"
        },
        "o-scan-ce": {
          title: "Marquage CE / déclaration de conformité O-scan",
          noticeTitle: "Déclaration de conformité O-scan",
          revision: "DCS - O-scan - Revision 3.17",
          product: "O-scan",
          statement: "La page officielle Esaote indique que l'O-scan est conforme à la directive 93/42/CEE relative aux dispositifs médicaux et classé dispositif de classe IIa.",
          sourceUrl: "https://www.esaote.com/fr-FR/resonance-magnetique/systeme-de-resonance-magnetique/o-scan/",
          sourceLabel: "Ouvrir la page officielle O-scan"
        },
        "s-scan-open-ce": {
          title: "Marquage CE / déclaration de conformité S-scan Open",
          noticeTitle: "Déclaration de conformité S-scan Open",
          revision: "DCS - S-scan Open - Revision 3.17",
          product: "S-scan Open",
          statement: "La page officielle Esaote liste la déclaration de conformité S-scan Open dans la rubrique Documentation - Brochure / DICOM / IHE.",
          sourceUrl: "https://www.esaote.com/fr-FR/resonance-magnetique/systeme-de-resonance-magnetique/s-scan-open/",
          sourceLabel: "Ouvrir la page officielle S-scan Open"
        },
        "g-scan-brio-ce": {
          title: "Marquage CE / déclaration de conformité G-scan Brio",
          noticeTitle: "Déclaration de conformité G-scan Brio",
          revision: "DCS - G-scan Brio - Revision 3.17",
          product: "G-scan Brio",
          statement: "La page officielle Esaote indique que le G-scan Brio est conforme à la directive 93/42/CEE relative aux dispositifs médicaux et classé dispositif de classe IIa.",
          sourceUrl: "https://www.esaote.com/en-BE/magnetic-resonance/magnetic-resonance-system/g-scan-brio/",
          sourceLabel: "Ouvrir la page officielle G-scan Brio"
        },
        "magnifico-open-ce": {
          title: "Marquage CE / déclaration de conformité Magnifico Open",
          noticeTitle: "Déclaration de conformité Magnifico Open",
          revision: "DCS - Magnifico Open - Revision 3.17",
          product: "Magnifico Open",
          statement: "La page officielle Esaote liste la déclaration de conformité Magnifico Open dans la rubrique Brochure / DICOM / IHE.",
          sourceUrl: "https://www.esaote.com/fr-BE/resonance-magnetique/systeme-de-resonance-magnetique/magnifico-open/",
          sourceLabel: "Ouvrir la page officielle Magnifico Open"
        },
        "i-genius-ce": {
          title: "Marquage CE / conformité I-Genius",
          noticeTitle: "Conformité I-Genius",
          revision: "Documentation officielle Esaote disponible publiquement",
          product: "I-Genius",
          statement: "La page officielle I-Genius liste la brochure et le conformance statement DICOM. Aucune déclaration CE séparée publiquement identifiable n'a été trouvée ; le document de marquage CE est à confirmer auprès d'Esaote France.",
          sourceUrl: "https://www.esaote.com/en-GB/magnetic-resonance/magnetic-resonance-system/igenius/",
          sourceLabel: "Ouvrir la page officielle I-Genius"
        },
        "dicom-mri-rel-3-17": {
          title: "DICOM Conformance Statement MRI Rel. 3.17",
          src: "assets/docs/dicom-conformance-statement-mri-rel-3-17.pdf"
        },
        "o-scan-dicom": {
          title: "DICOM Conformance Statement MRI Rel. 3.17",
          src: "assets/docs/dicom-conformance-statement-mri-rel-3-17.pdf"
        },
        "o-scan-ihe": {
          title: "IHE Integration Statement O-scan",
          src: "assets/docs/o-scan-ihe-integration-statement-latest.pdf"
        },
        "g-scan-brio-ihe": {
          title: "IHE Integration Statement G-scan Brio",
          src: "assets/docs/g-scan-brio-ihe-integration-statement-latest.pdf"
        },
        "magnifico-open-ihe": {
          title: "IHE Integration Statement Magnifico Open",
          src: "assets/docs/magnifico-open-ihe-integration-statement-latest.pdf"
        }
      };
      var params = new URLSearchParams(window.location.search);
      var doc = docs[params.get("doc") || ""];
      var title = document.getElementById("documentTitle");
      var frame = document.getElementById("documentFrame");
      var pages = document.getElementById("documentPages");
      var fallback = document.getElementById("documentFallback");
      var close = document.getElementById("documentClose");

      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html#produits";
        }
      }

      close.addEventListener("click", goBack);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") goBack();
      });

      if (!doc) {
        frame.hidden = true;
        fallback.hidden = false;
        return;
      }

      document.title = doc.title + " — Esaote Medical France";
      title.textContent = doc.title;
      window.addEventListener("load", function () {
        if (window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({
            path: "document-" + (params.get("doc") || "inconnu"),
            title: "Document consulté — " + doc.title,
            event: true
          });
        }
      });
      if (doc.pages && doc.pages.length) {
        frame.hidden = true;
        pages.hidden = false;
        pages.innerHTML = doc.pages.map(function (src, index) {
          return '<figure class="document-viewer__page"><img src="' + src + '" alt="' + doc.title + ' - page ' + (index + 1) + '" loading="' + (index === 0 ? 'eager' : 'lazy') + '" /></figure>';
        }).join("");
      } else if (doc.noticeTitle) {
        frame.hidden = true;
        pages.hidden = false;
        pages.innerHTML = '<article class="document-viewer__notice">' +
          '<span class="kicker">' + doc.product + '</span>' +
          '<h1>' + doc.noticeTitle + '</h1>' +
          '<p class="document-viewer__revision">' + doc.revision + '</p>' +
          '<p>' + doc.statement + '</p>' +
          '<a class="btn" href="' + doc.sourceUrl + '" target="_blank" rel="noopener">' + doc.sourceLabel + '</a>' +
          '</article>';
      } else {
        frame.src = doc.src + "#toolbar=1&navpanes=0&scrollbar=1&page=1&view=FitH";
      }
    })();
  </script>
</body>
</html>
