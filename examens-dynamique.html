<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>True Motion — IRM dynamique — Ced4Scale</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/logo-ced4scale.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260811-machine-box" />
  <script data-goatcounter="https://ced4scale.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body class="document-page">
  <header class="document-viewer__bar">
    <a class="document-viewer__brand" href="index.html#champ-moyen" aria-label="Retour au site Esaote">
      <img src="assets/logo-esaote.svg" alt="Esaote" />
    </a>
    <div class="document-viewer__title">
      <span>IRM dynamique</span>
      <strong>True Motion — vidéo Esaote</strong>
    </div>
    <button class="document-viewer__close" id="videoClose" type="button" aria-label="Fermer et revenir à la page précédente">&times;</button>
  </header>

  <main class="procedure-slideshow">
    <div class="procedure-slideshow__intro">
      <span class="kicker">Vidéo officielle Esaote</span>
      <h1>True Motion — imagerie articulaire en mouvement</h1>
      <p>Lecture ralentie automatiquement pour mieux suivre le mouvement de l'articulation.</p>
    </div>
    <div class="procedure-slideshow__stage" style="aspect-ratio:6.72/9; overflow:hidden; max-width:70%; margin:0 auto;">
      <iframe
        src="https://player.vimeo.com/video/951049928?dnt=1&title=0&byline=0&portrait=0&loop=1&autoplay=1&muted=1"
        title="True motion MRI - vidéo Esaote (partie IRM, image de droite masquée)"
        loading="lazy"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        allowfullscreen webkitallowfullscreen mozallowfullscreen
        data-vimeo-slow-rate="0.5"
        style="position:absolute; top:0; left:0; width:238.1%; height:100%; border:0;"
      ></iframe>
    </div>
    <p style="color:var(--muted); font-size:.85rem; margin-top:10px;">Vidéo recadrée pour n'afficher que la partie imagerie IRM.</p>
  </main>

  <script>
    (function () {
      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = "index.html#champ-moyen";
        }
      }
      document.getElementById("videoClose").addEventListener("click", goBack);
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") goBack();
      });
    })();
  </script>
  <script src="https://player.vimeo.com/api/player.js"></script>
  <script src="assets/video-speed.js?v=20260731-slow-true-motion" defer></script>
</body>
</html>
